<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Live Collaborative Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>📌 Classroom Live Board</h1>
      <span class="badge" id="online-badge">🟢 0 Students Online</span>
    </div>
    <button id="clear-btn" class="btn-danger" title="Instructor Only">Clear Board</button>
  </header>

  <main>
    <section class="composer">
      <form id="post-form">
        <div class="input-row">
          <input type="text" id="studentName" placeholder="Your Name *" required maxlength="40" />
          <input type="text" id="rollNo" placeholder="Roll No / ID *" required maxlength="20" />
          <select id="category">
            <option value="Idea">💡 Idea / Answer</option>
            <option value="Question">❓ Question</option>
            <option value="Summary">📝 Note / Summary</option>
          </select>
          <select id="cardColor" aria-label="Note Color">
            <option value="#fef08a">Yellow Note</option>
            <option value="#bbf7d0">Green Note</option>
            <option value="#bfdbfe">Blue Note</option>
            <option value="#fbcfe8">Pink Note</option>
          </select>
        </div>
        <div class="message-row">
          <textarea id="message" rows="2" placeholder="Write your response, idea, or question here..." required maxlength="500"></textarea>
          <button type="submit" class="btn-primary">Post to Board 🚀</button>
        </div>
      </form>
    </section>

    <section id="board-grid" class="board-grid">
      <!-- Live student cards appear here -->
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
